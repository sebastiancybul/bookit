name: bookit

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookit}
      POSTGRES_USER: ${POSTGRES_USER:-bookit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookit}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: [app]
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookit}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bookit}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:80:8080"
    depends_on:
      - backend

volumes:
  postgres-data:
